name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Validate HTML (catches unclosed tags, etc.)
        run: npm run lint:html
      - name: Lint JS (ESLint)
        run: npm run lint:js
