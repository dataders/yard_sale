<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Hill &amp; Westover Hills Yard Sales</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root { --bg:#f7f5f0; --ink:#2b2b2b; --fh:#7b2d8e; --wh:#1c6e8c; --both:#b85c00; --route:#d62828; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:10px 14px; background:#fff; border-bottom:1px solid #e2ddd3; }
  header h1 { margin:0; font-size:1.05rem; }
  header p { margin:2px 0 0; font-size:.8rem; color:#666; }
  #errbar { color:#b00020; font-weight:600; white-space:pre-wrap; word-break:break-word; }
  #main { flex:1; display:flex; min-height:0; }
  #sidebar { width:340px; max-width:42%; display:flex; flex-direction:column; border-right:1px solid #e2ddd3; background:var(--bg); }
  #controls { padding:8px 10px; display:flex; flex-direction:column; gap:6px; border-bottom:1px solid #e2ddd3; }
  #search { padding:7px 9px; border:1px solid #cfc8ba; border-radius:6px; font-size:.9rem; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:.72rem; padding:4px 9px; border-radius:20px; border:1px solid #cfc8ba; background:#fff; cursor:pointer; user-select:none; }
  .chip.active { color:#fff; border-color:transparent; }
  .chip[data-f="all"].active { background:#555; }
  .chip[data-f="Forest Hill"].active { background:var(--fh); }
  .chip[data-f="Westover Hills"].active { background:var(--wh); }
  #count { font-size:.74rem; color:#777; padding:0 2px; }

  /* Route panel */
  #route { border-bottom:1px solid #e2ddd3; background:#fff; }
  #route.empty { display:none; }
  #route .rhead { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; cursor:pointer; }
  #route .rhead b { font-size:.85rem; }
  #route .rbody { padding:0 10px 10px; }
  #route.collapsed .rbody { display:none; }
  #route ol { margin:4px 0 8px; padding-left:0; list-style:none; counter-reset:stop; }
  #route li { display:flex; align-items:center; gap:7px; font-size:.82rem; padding:2px 0; }
  #route li .num { flex:none; width:18px; height:18px; border-radius:50%; background:var(--route); color:#fff; font-size:.66rem; display:flex; align-items:center; justify-content:center; }
  #route li .x { margin-left:auto; color:#bbb; cursor:pointer; font-weight:700; padding:0 4px; }
  #route li .x:hover { color:var(--route); }
  #route .stats { font-size:.76rem; color:#555; margin-bottom:7px; }
  .rbtns { display:flex; gap:6px; flex-wrap:wrap; }
  .btn { font-size:.78rem; padding:6px 10px; border-radius:6px; border:1px solid #cfc8ba; background:#fff; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-block; }
  .btn.primary { background:var(--route); border-color:transparent; color:#fff; }
  .btn.gmaps { background:#1a73e8; border-color:transparent; color:#fff; }
  label.startopt { display:flex; align-items:center; gap:6px; font-size:.76rem; color:#555; margin:7px 0; }

  #list { overflow-y:auto; flex:1; }
  .item { padding:9px 12px; border-bottom:1px solid #ebe6db; cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
  .item:hover { background:#fff; }
  .item.sel { background:#fff; box-shadow: inset 3px 0 0 var(--both); }
  .item .body { flex:1; min-width:0; }
  .item .addr { font-weight:600; font-size:.9rem; }
  .item .src { font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; color:#888; margin-top:2px; }
  .item .items { font-size:.78rem; color:#555; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item .pick { flex:none; margin-top:2px; }
  .item .pick input { width:17px; height:17px; accent-color:var(--route); }

  #map { flex:1; position:relative; }
  #locate { position:absolute; z-index:500; right:10px; top:10px; width:40px; height:40px; border-radius:8px; border:1px solid #cfc8ba; background:#fff; cursor:pointer; font-size:1.1rem; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  #locate.on { background:#1a73e8; color:#fff; border-color:transparent; }
  .dot { border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  .numpin { border-radius:50%; border:2px solid #fff; background:var(--route); color:#fff; font-weight:700; font-size:.72rem; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px rgba(0,0,0,.3); }
  .mepin { border-radius:50%; background:#1a73e8; border:3px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.3); }
  .leaflet-popup-content { font-size:.85rem; }
  .leaflet-popup-content .pa { font-weight:600; }
  .leaflet-popup-content a { color:var(--wh); }
  .leaflet-popup-content button.addbtn { margin-top:6px; font-size:.78rem; padding:4px 9px; border-radius:6px; border:1px solid var(--route); background:#fff; color:var(--route); cursor:pointer; }
  .leaflet-popup-content button.addbtn.added { background:var(--route); color:#fff; }

  @media (max-width:640px) {
    #main { flex-direction:column; }
    #sidebar { width:100%; max-width:none; height:48%; border-right:none; border-bottom:1px solid #e2ddd3; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Forest Hill &amp; Westover Hills Yard Sales</h1>
    <p id="subtitle">Loading…</p>
    <p id="errbar" hidden></p>
  </header>
  <div id="main">
    <aside id="sidebar">
      <div id="controls">
        <input id="search" type="search" placeholder="Search address or items…" autocomplete="off">
        <div class="filters">
          <span class="chip active" data-f="all">All</span>
          <span class="chip" data-f="Forest Hill">Forest Hill</span>
          <span class="chip" data-f="Westover Hills">Westover Hills</span>
        </div>
        <div id="count"></div>
      </div>

      <div id="route" class="empty collapsed">
        <div class="rhead" id="rhead">
          <b id="rtitle">Route</b>
          <span id="rtoggle" style="font-size:.8rem;color:#888">▸</span>
        </div>
        <div class="rbody">
          <ol id="rlist"></ol>
          <div class="stats" id="rstats"></div>
          <label class="startopt">
            <input type="checkbox" id="startHere"> Start from my location
          </label>
          <div class="rbtns">
            <a class="btn gmaps" id="gmaps" target="_blank" rel="noopener">Open in Google Maps ↗</a>
            <button class="btn" id="clearRoute">Clear</button>
          </div>
        </div>
      </div>

      <div id="list"></div>
    </aside>
    <div id="map">
      <button id="locate" title="Show my location">◎</button>
    </div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data/sales.js"></script>
<script src="app.js"></script>
</body>
</html>
